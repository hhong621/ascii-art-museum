<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to ASCII Art Museum</title>
    <script>
        (function () {
            var target = 'https://hhong621.github.io' +
                location.pathname.replace(/^\/ARTIC-ASCII/, '/ascii-art-museum') +
                location.search +
                location.hash;
            document.write(
                '<link rel="canonical" href="' + target + '">' +
                '<meta http-equiv="refresh" content="0; url=' + target + '">'
            );
            location.replace(target);
        }());
    </script>
</head>
<body>
    <p>This site has moved. Redirecting to <a href="https://hhong621.github.io/ascii-art-museum/">ASCII Art Museum</a>…</p>
</body>
</html>
